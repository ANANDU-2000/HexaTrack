<!DOCTYPE html>

                      "secondary-fixed": "#e1dfff",
                      "surface-dim": "#11131a",

                      "inverse-surface": "#e1e2ec",
                      "outline-variant": "#424753",

                      "surface-bright": "#373941",
                      "on-primary": "#002d6c",

                      "on-background": "#e1e2ec",

              "borderRadius": {

                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "gutter-bento": "12px",
                      "stack-gap": "16px",
                      "section-padding": "24px",
                      "margin-main": "20px"
              },
              "fontFamily": {
                      "label-caps": [
                              "Hanken Grotesk"
                      ],
                      "amount-md": [
                              "Manrope"
                      ],
                      "headline-lg": [

                      ],
                      "headline-md": [

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background min-h-screen overflow-hidden flex flex-col font-body-md antialiased select-none">
<!-- Mock Background (Dashboard) -->
<div class="absolute inset-0 z-0 opacity-40 grayscale blur-sm pointer-events-none flex flex-col p-margin-main gap-stack-gap">
<div class="h-32 bg-surface-container rounded-xl w-full"></div>
<div class="grid grid-cols-2 gap-gutter-bento">
<div class="h-40 bg-surface-container rounded-xl"></div>
<div class="h-40 bg-surface-container rounded-xl"></div>
</div>
<div class="h-64 bg-surface-container rounded-xl w-full"></div>
</div>
<!-- Bottom Sheet Overlay -->
<div class="absolute inset-0 bg-background/60 backdrop-blur-md z-40"></div>
<!-- Bottom Sheet Content -->
<div class="absolute bottom-0 left-0 w-full bg-surface-container/90 backdrop-blur-[24px] border-t border-outline-variant/30 rounded-t-[2rem] z-50 flex flex-col shadow-[0_-8px_32px_rgba(0,0,0,0.5)]">
<!-- Handle -->
<div class="w-full flex justify-center pt-4 pb-2">
<div class="w-12 h-1.5 bg-outline-variant/50 rounded-full"></div>
</div>
<!-- Sheet Header -->
<div class="px-margin-main pt-2 pb-6 flex justify-between items-center">
<h2 class="text-headline-md font-headline-md text-on-background">Add Transaction</h2>
<button class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant hover:text-on-background transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="close">close</span>
</button>
</div>
<!-- Amount Input Area -->
<div class="px-margin-main pb-8 flex flex-col items-center justify-center relative">
<!-- Subtle Radial Glow behind amount -->
<div class="absolute w-40 h-40 bg-primary/10 rounded-full blur-[40px] z-0"></div>
<div class="relative z-10 text-on-background flex items-center justify-center">
<span class="text-headline-lg font-headline-lg mr-1 text-on-surface-variant">$</span>
<input class="bg-transparent border-none text-center text-display-amount font-display-amount w-full max-w-[200px] focus:ring-0 p-0 text-on-background placeholder-on-surface-variant/30" placeholder="0" readonly="" type="text" value="0"/>
</div>
<span class="text-body-md font-body-md text-on-surface-variant mt-2">USD Balance</span>
</div>
<!-- Type Toggle -->
<div class="px-margin-main pb-stack-gap">
<div class="flex p-1 bg-surface-container-highest rounded-xl">
<button class="flex-1 py-2 text-center rounded-lg bg-error-container/20 text-error font-label-caps text-label-caps transition-all">
                    Expense
                </button>
<button class="flex-1 py-2 text-center rounded-lg text-on-surface-variant hover:text-on-background font-label-caps text-label-caps transition-all">
                    Income
                </button>
<button class="flex-1 py-2 text-center rounded-lg text-on-surface-variant hover:text-on-background font-label-caps text-label-caps transition-all">
                    Transfer
                </button>
</div>
</div>
<!-- Category Chips -->
<div class="px-margin-main pb-8">
<h3 class="text-label-caps font-label-caps text-on-surface-variant mb-3">Category</h3>
<div class="flex flex-wrap gap-3">
<button class="px-4 py-2 rounded-full border border-outline-variant/50 bg-surface-container text-on-background font-body-md text-body-md hover:bg-surface-container-high transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]" data-icon="restaurant">restaurant</span> Food
                </button>
<button class="px-4 py-2 rounded-full border border-outline-variant/50 bg-surface-container text-on-background font-body-md text-body-md hover:bg-surface-container-high transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]" data-icon="directions_car">directions_car</span> Transport
                </button>
<button class="px-4 py-2 rounded-full border border-outline-variant/50 bg-surface-container text-on-background font-body-md text-body-md hover:bg-surface-container-high transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]" data-icon="shopping_bag">shopping_bag</span> Shopping
                </button>
<button class="px-4 py-2 rounded-full border border-outline-variant/50 bg-surface-container text-on-background font-body-md text-body-md hover:bg-surface-container-high transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]" data-icon="home">home</span> Rent
                </button>
<button class="w-10 h-10 rounded-full border border-dashed border-outline-variant flex items-center justify-center text-on-surface-variant hover:text-on-background transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="add">add</span>
</button>
</div>
</div>
<!-- Note Input (Glass Input) -->
<div class="px-margin-main pb-8">
<div class="bg-surface-container-low border border-outline-variant/40 rounded-xl px-4 py-3 focus-within:border-primary-container focus-within:shadow-[0_0_12px_rgba(82,141,255,0.1)] transition-all">
<input class="w-full bg-transparent border-none focus:ring-0 p-0 text-body-md font-body-md text-on-background placeholder-on-surface-variant/50 outline-none" placeholder="Add a note..." type="text"/>
</div>
</div>
<!-- Action Button -->
<div class="px-margin-main pb-safe mb-6">
<button class="w-full bg-primary-container text-on-primary-container font-amount-md text-amount-md py-4 rounded-xl hover:opacity-90 transition-opacity flex items-center justify-center shadow-[0_4px_24px_rgba(82,141,255,0.2)]">
                Save Transaction
            </button>
</div>
</div>
</body></html>
