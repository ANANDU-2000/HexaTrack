<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HexaTrack - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600&amp;family=Hanken+Grotesk:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed-dim": "#cfbcff",
                        "surface-tint": "#cfbcff",
                        "surface-container-highest": "#36343a",
                        "primary": "#cfbcff",
                        "primary-container": "#6750a4",
                        "surface-container-lowest": "#0f0d13",
                        "on-primary-fixed-variant": "#4f378a",
                        "on-tertiary": "#3e2e00",
                        "on-secondary": "#342b4b",
                        "tertiary-fixed-dim": "#e7c365",
                        "on-surface-variant": "#cbc4d2",
                        "tertiary": "#e7c365",
                        "on-secondary-container": "#bfb2da",
                        "on-error-container": "#ffdad6",
                        "secondary": "#cdc0e9",
                        "on-tertiary-fixed": "#241a00",
                        "secondary-fixed": "#e9ddff",
                        "surface-dim": "#141218",
                        "surface-container-high": "#2b292f",
                        "on-primary-fixed": "#22005d",
                        "on-error": "#690005",
                        "inverse-surface": "#e6e0e9",
                        "background": "#141218",
                        "primary-fixed": "#e9ddff",
                        "error-container": "#93000a",
                        "secondary-fixed-dim": "#cdc0e9",
                        "tertiary-container": "#c9a74d",
                        "surface": "#141218",
                        "on-primary-container": "#e0d2ff",
                        "surface-bright": "#3b383e",
                        "tertiary-fixed": "#ffdf93",
                        "inverse-on-surface": "#322f35",
                        "secondary-container": "#4d4465",
                        "surface-container": "#211f24",
                        "on-background": "#e6e0e9",
                        "on-secondary-fixed-variant": "#4b4263",
                        "error": "#ffb4ab",
                        "surface-variant": "#36343a",
                        "on-surface": "#e6e0e9",
                        "on-tertiary-container": "#503d00",
                        "on-secondary-fixed": "#1f1635",
                        "on-tertiary-fixed-variant": "#594400",
                        "inverse-primary": "#6750a4",
                        "surface-container-low": "#1d1b20",
                        "outline": "#948e9c",
                        "outline-variant": "#494551",
                        "on-primary": "#381e72"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "stack-md": "16px",
                        "gutter": "16px",
                        "stack-sm": "8px",
                        "card-padding": "24px",
                        "stack-lg": "32px",
                        "container-margin": "20px"
                    },
                    "fontFamily": {
                        "headline-md": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "mono-data": ["Geist"],
                        "label-caps": ["Geist"],
                        "display-balance": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "mono-data": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "600" }],
                        "display-balance": ["48px", { "lineHeight": "52px", "letterSpacing": "-0.04em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col relative overflow-hidden antialiased">
<!-- Ambient Lighting Effects -->
<div class="absolute top-[-15%] left-[-10%] w-[60vw] h-[60vw] bg-primary-container/20 rounded-full blur-[120px] pointer-events-none mix-blend-screen"></div>
<div class="absolute bottom-[-15%] right-[-10%] w-[50vw] h-[50vw] bg-tertiary-container/10 rounded-full blur-[100px] pointer-events-none mix-blend-screen"></div>
<main class="flex-1 flex flex-col items-center justify-center w-full px-container-margin z-10 py-stack-lg">
<!-- Header Section -->
<div class="text-center mb-stack-lg flex flex-col items-center">
<div class="w-16 h-16 bg-surface-container-high rounded-full flex items-center justify-center mb-stack-md border border-outline/20 shadow-[0_8px_16px_rgba(20,18,24,0.6)]">
<span class="material-symbols-outlined text-primary text-[32px]" data-icon="hexagon" data-weight="fill" style="font-variation-settings: 'FILL' 1;">hexagon</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-background mb-2 tracking-tight">HexaTrack</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Secure your digital assets</p>
</div>
<!-- Glassmorphism Login Form -->
<form class="w-full max-w-[420px] bg-white/[0.04] backdrop-blur-[24px] border border-white/10 rounded-xl p-card-padding shadow-[0_32px_64px_rgba(11,16,32,0.6)] flex flex-col gap-stack-lg relative overflow-hidden">
<!-- Subtle inner top edge highlight -->
<div class="absolute top-0 left-0 right-0 h-[1px] bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
<div class="flex flex-col gap-stack-md">
<!-- Email Field -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="email">Email Address</label>
<input class="h-[56px] w-full bg-surface-container-high/80 border border-outline-variant rounded-[12px] px-4 font-body-md text-body-md text-on-surface placeholder-on-surface-variant/40 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all duration-300" id="email" placeholder="hello@example.com" type="email"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-stack-sm">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="password">Password</label>
<a class="font-mono-data text-mono-data text-primary hover:text-primary-fixed transition-colors" href="#">Recover</a>
</div>
<div class="relative">
<input class="h-[56px] w-full bg-surface-container-high/80 border border-outline-variant rounded-[12px] px-4 font-body-md text-body-md text-on-surface placeholder-on-surface-variant/40 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all duration-300" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-stack-md mt-2">
<button class="h-[56px] w-full bg-primary-container text-on-primary-container rounded-full font-headline-md text-headline-md flex items-center justify-center transition-transform hover:scale-[0.98] active:scale-95 shadow-[0_0_24px_rgba(103,80,164,0.4)] relative overflow-hidden group" type="button">
<div class="absolute inset-0 bg-white/20 translate-y-[100%] group-hover:translate-y-0 transition-transform duration-300 rounded-full"></div>
<span class="relative z-10 flex items-center gap-2">
                        Login
                        <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</span>
</button>
<button class="flex items-center justify-center gap-2 h-[48px] text-primary font-mono-data text-mono-data hover:bg-white/5 rounded-full transition-colors w-max mx-auto px-6" type="button">
<span class="material-symbols-outlined" data-icon="face" data-weight="fill" style="font-variation-settings: 'FILL' 1;">face</span>
                    Sign in with Face ID
                </button>
</div>
<!-- Divider -->
<div class="flex items-center gap-4 py-2">
<hr class="flex-1 border-outline-variant"/>
<span class="font-label-caps text-label-caps text-outline">OR</span>
<hr class="flex-1 border-outline-variant"/>
</div>
<!-- Social Logins -->
<div class="flex gap-4">
<button class="flex-1 h-[56px] rounded-[12px] bg-surface-container border border-outline-variant flex items-center justify-center hover:bg-surface-container-high transition-colors text-on-surface gap-2 font-mono-data text-mono-data" type="button">
<span class="material-symbols-outlined" data-icon="g_mobiledata" style="font-size: 28px;">g_mobiledata</span>
                    Google
                </button>
<button class="flex-1 h-[56px] rounded-[12px] bg-surface-container border border-outline-variant flex items-center justify-center hover:bg-surface-container-high transition-colors text-on-surface gap-2 font-mono-data text-mono-data" type="button">
<span class="material-symbols-outlined" data-icon="apple">File</span>
                    Apple
                </button>
</div>
</form>
<!-- Footer link -->
<div class="mt-stack-lg font-body-md text-body-md text-on-surface-variant text-center">
            New to HexaTrack? <a class="text-primary hover:text-primary-fixed transition-colors font-semibold" href="#">Create an account</a>
</div>
</main>
</body></html>
