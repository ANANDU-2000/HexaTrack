<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Glassmorphism Utilities */
        .glass-panel {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 24px 40px rgba(11, 16, 32, 0.4);
        }
        
        .glass-pill {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
        }
        
        /* Inner Glow for floating elements */
        .inner-glow {
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.1);

        .glow-cyan:focus-within {
            box-shadow: 0 0 0 1px #06B6D4, 0 0 12px rgba(6, 182, 212, 0.3);

    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden selection:bg-primary/30 selection:text-primary">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-container-margin py-4 w-full full-width top-0 sticky backdrop-blur-xl bg-background/60 z-40 flat no shadows">
<div class="flex items-center gap-stack-md">
<!-- Back button since this is a transactional task screen -->
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-high text-on-surface-variant hover:opacity-80 scale-95 transition-transform">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold tracking-tight">Add Transaction</h1>
</div>
<div class="flex items-center">
<!-- Trailing Action -->
<button aria-label="Scan Receipt" class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-high text-on-surface-variant hover:opacity-80 scale-95 transition-transform">
<span class="material-symbols-outlined">document_scanner</span>
</button>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 flex flex-col px-container-margin pb-32 max-w-lg mx-auto w-full relative">
<!-- Amount Input Area -->
<section class="flex flex-col items-center justify-center py-stack-lg mb-stack-md">
<div class="flex items-center justify-center gap-2 mb-stack-sm text-on-surface-variant">
<span class="font-body-lg text-body-lg">$</span>
<input aria-label="Transaction Amount" class="bg-transparent border-none text-center font-display-balance text-display-balance text-on-background w-full max-w-[280px] focus:ring-0 p-0 m-0" readonly="" type="text" value="0.00"/>
</div>
<!-- Type Toggle (Expense / Income) -->
<div class="flex bg-surface-container-highest rounded-full p-1 mt-stack-md relative inner-glow">
<button class="px-6 py-2 rounded-full font-label-caps text-label-caps bg-surface-variant text-on-surface shadow-sm relative z-10 transition-colors">EXPENSE</button>
<button class="px-6 py-2 rounded-full font-label-caps text-label-caps text-on-surface-variant hover:text-on-surface transition-colors">INCOME</button>
</div>
</section>
<!-- Form Elements -->
<section class="flex flex-col gap-stack-md flex-1">
<!-- Note / Merchant Input -->
<div class="glass-panel rounded-DEFAULT p-1 focus-within:border-primary/50 transition-colors">
<div class="flex items-center bg-surface-container px-4 py-3 rounded-[15px]">
<span class="material-symbols-outlined text-on-surface-variant mr-3">edit_note</span>
<input class="bg-transparent border-none w-full text-on-background placeholder:text-on-surface-variant/50 focus:ring-0 font-body-md text-body-md p-0" placeholder="What was this for?" type="text"/>
<button aria-label="Voice Input" class="text-primary hover:opacity-80 ml-2">
<span class="material-symbols-outlined">mic</span>
</button>
</div>
</div>
<!-- AI Category Suggestions -->
<div class="flex flex-col gap-stack-sm mt-stack-sm">
<div class="flex items-center justify-between px-1">
<span class="font-label-caps text-label-caps text-on-surface-variant">SUGGESTED CATEGORIES</span>
<span class="material-symbols-outlined text-primary text-[16px]">auto_awesome</span>
</div>
<div class="flex flex-wrap gap-2">
<button class="flex items-center gap-2 px-4 py-2 rounded-full glass-pill text-on-surface hover:bg-white/10 transition-colors border border-white/5">
<span class="material-symbols-outlined text-[18px] text-tertiary">restaurant</span>
<span class="font-mono-data text-mono-data">Dining</span>
</button>
<button class="flex items-center gap-2 px-4 py-2 rounded-full glass-pill text-on-surface hover:bg-white/10 transition-colors border border-white/5">
<span class="material-symbols-outlined text-[18px] text-secondary">shopping_cart</span>
<span class="font-mono-data text-mono-data">Groceries</span>
</button>
<button class="flex items-center gap-2 px-4 py-2 rounded-full bg-surface-container-high text-on-surface-variant hover:text-on-surface transition-colors border border-transparent">
<span class="material-symbols-outlined text-[18px]">more_horiz</span>
<span class="font-mono-data text-mono-data">More</span>
</button>
</div>
</div>
<!-- Custom Keypad -->
<div class="mt-auto pt-stack-lg grid grid-cols-3 gap-2">
<button class="h-14 rounded-DEFAULT bg-surface-container-highest hover:bg-surface-variant text-on-background font-headline-md text-headline-md flex items-center justify-center transition-colors">1</button>
<button class="h-14 rounded-DEFAULT bg-surface-container-highest hover:bg-surface-variant text-on-background font-headline-md text-headline-md flex items-center justify-center transition-colors">2</button>
<button class="h-14 rounded-DEFAULT bg-surface-container-highest hover:bg-surface-variant text-on-background font-headline-md text-headline-md flex items-center justify-center transition-colors">3</button>
<button class="h-14 rounded-DEFAULT bg-surface-container-highest hover:bg-surface-variant text-on-background font-headline-md text-headline-md flex items-center justify-center transition-colors">4</button>
<button class="h-14 rounded-DEFAULT bg-surface-container-highest hover:bg-surface-variant text-on-background font-headline-md text-headline-md flex items-center justify-center transition-colors">5</button>
<button class="h-14 rounded-DEFAULT bg-surface-container-highest hover:bg-surface-variant text-on-background font-headline-md text-headline-md flex items-center justify-center transition-colors">6</button>
<button class="h-14 rounded-DEFAULT bg-surface-container-highest hover:bg-surface-variant text-on-background font-headline-md text-headline-md flex items-center justify-center transition-colors">7</button>
<button class="h-14 rounded-DEFAULT bg-surface-container-highest hover:bg-surface-variant text-on-background font-headline-md text-headline-md flex items-center justify-center transition-colors">8</button>
<button class="h-14 rounded-DEFAULT bg-surface-container-highest hover:bg-surface-variant text-on-background font-headline-md text-headline-md flex items-center justify-center transition-colors">9</button>
<button class="h-14 rounded-DEFAULT bg-surface-container-highest hover:bg-surface-variant text-on-background font-headline-md text-headline-md flex items-center justify-center transition-colors">.</button>
<button class="h-14 rounded-DEFAULT bg-surface-container-highest hover:bg-surface-variant text-on-background font-headline-md text-headline-md flex items-center justify-center transition-colors">0</button>
<button aria-label="Backspace" class="h-14 rounded-DEFAULT bg-surface-container-highest hover:bg-surface-variant text-on-background font-headline-md text-headline-md flex items-center justify-center transition-colors">
<span class="material-symbols-outlined">backspace</span>
</button>
</div>
</section>
<!-- Prominent Confirm Button Area -->
<div class="fixed bottom-6 left-0 right-0 px-container-margin z-50 max-w-lg mx-auto">
<button class="w-full h-[56px] rounded-full bg-[#6366F1] text-white font-headline-md text-headline-md flex items-center justify-center gap-2 hover:opacity-90 active:scale-95 transition-all shadow-[0_8px_16px_rgba(99,102,241,0.2)]">
<span class="material-symbols-outlined fill">check_circle</span>
                Confirm Transaction
            </button>
</div>
</main>
<!-- Navigation Shell suppressed because this is a Transactional task screen -->
