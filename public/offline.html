<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10B981" />
    <title>HexaTrack Offline</title>
    <style>
      :root {
        color-scheme: light;
        background: #f8fafc;
        color: #111827;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(env(safe-area-inset-top), 24px) 20px max(env(safe-area-inset-bottom), 24px);
        overflow-x: hidden;
      }

      main {
        width: min(100%, 420px);
        border: 1px solid #d1fae5;
        border-radius: 24px;
        background: #fff;
        padding: 28px;
        box-shadow: 0 24px 70px rgba(15, 23, 42, 0.1);
      }

      img {
        height: 72px;
        width: 72px;
        border-radius: 22px;
        box-shadow: 0 18px 40px rgba(16, 185, 129, 0.26);
      }

      h1 {
        margin: 22px 0 8px;
        font-size: 28px;
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: #6b7280;
        font-size: 15px;
        line-height: 1.7;
      }

      a {
        margin-top: 22px;
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        background: #10b981;
        padding: 0 18px;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        box-shadow: 0 14px 30px rgba(16, 185, 129, 0.25);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192x192.png" alt="" />
      <h1>HexaTrack is offline</h1>
      <p>Your cached dashboard and transaction history will reopen when available. Connect to the internet to sync fresh finance data.</p>
      <a href="/">Open dashboard</a>
    </main>
  </body>
</html>
