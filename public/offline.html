<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050816" />
    <title>HexaTrack Offline</title>
    <style>
      :root {
        color-scheme: dark;
        background: #050816;
        color: #F5F7FA;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(env(safe-area-inset-top), 24px) 20px max(env(safe-area-inset-bottom), 24px);
        overflow: hidden;
        background: radial-gradient(circle at center, #0B1021 0%, #050816 100%);
      }

      main {
        width: min(100%, 420px);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 28px;
        background: rgba(14, 21, 43, 0.72);
        padding: 36px 28px;
        box-shadow: 0 32px 80px rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .logo-container {
        position: relative;
        height: 80px;
        width: 80px;
        margin-bottom: 24px;
      }

      .glow {
        position: absolute;
        inset: -6px;
        border-radius: 24px;
        background: #10B981;
        opacity: 0.15;
        filter: blur(12px);
        z-index: 0;
      }

      img {
        position: relative;
        z-index: 1;
        height: 80px;
        width: 80px;
        border-radius: 22px;
        border: 1.5px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 12px 32px rgba(16, 185, 129, 0.2);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #FFF 0%, #A3AEDB 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      p {
        margin: 0 0 28px;
        color: #8B9BB4;
        font-size: 14px;
        line-height: 1.6;
        font-weight: 500;
      }

      .action-button {
        display: inline-flex;
        min-height: 52px;
        width: 100%;
        align-items: center;
        justify-content: center;
        border-radius: 18px;
        background: linear-gradient(135deg, #10B981 0%, #059669 100%);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #fff;
        font-size: 14px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        text-decoration: none;
        box-shadow: 0 8px 30px rgba(16, 185, 129, 0.3), inset 0 2px 4px rgba(255, 255, 255, 0.2);
        transition: transform 0.2s;
      }

      .action-button:active {
        transform: scale(0.98);
      }

      .wifi-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 20px;
        padding: 6px 12px;
        border-radius: 100px;
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.2);
        color: #F87171;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo-container">
        <div class="glow"></div>
        <img src="/icons/icon-192x192.png" alt="HexaTrack Logo" />
      </div>
      <h1>HexaTrack is Offline</h1>
      <p>Your cached account balances, categories, and offline transactions remain completely accessible. Restore your network connection to synchronize new logs.</p>
      <a href="/" class="action-button">Launch Workspace</a>
      <div class="wifi-badge">
        <span>No Connection</span>
      </div>
    </main>
  </body>
</html>
